name: Tuesday iteration

on:
  schedule:
    - cron: '0 6 * * 2'      # Every Tuesday at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit or deploy)'
        type: boolean
        default: false
      model:
        description: 'Override model (e.g. claude-opus-4-7, claude-sonnet-4-6, claude-haiku-4-5-20251001)'
        required: false
        default: ''

concurrency:
  group: tuesday-iteration
  cancel-in-progress: false

permissions:
  contents: write             # script commits and pushes back to main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Use npm install (not npm ci) so first-time bring-up works without
      # requiring the user to generate a lockfile locally first. Once a
      # package-lock.json is committed, npm install still honours it.
      - run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run Tuesday job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          DRY_RUN: ${{ inputs.dry_run }}
          MODEL: ${{ inputs.model || 'claude-opus-4-7' }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL || 'claude-haiku-4-5-20251001' }}
          # Marketing
          MARKETING_ENABLED: ${{ secrets.MARKETING_ENABLED || 'true' }}
          MARKETING_AUTOPOST_BLUESKY: ${{ secrets.MARKETING_AUTOPOST_BLUESKY || 'false' }}
          MARKETING_AUTOPOST_MASTODON: ${{ secrets.MARKETING_AUTOPOST_MASTODON || 'false' }}
          MARKETING_AUTOPOST_X: ${{ secrets.MARKETING_AUTOPOST_X || 'false' }}
          MARKETING_AUTOPOST_NEWSLETTER: ${{ secrets.MARKETING_AUTOPOST_NEWSLETTER || 'false' }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: npx tsx scripts/tuesday.ts
