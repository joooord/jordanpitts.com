name: Tuesday iteration

on:
  schedule:
    - cron: '0 6 * * 2'      # Every Tuesday at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit or deploy)'
        type: boolean
        default: false
      model:
        description: 'Override model (e.g. claude-opus-5, claude-fable-5). Verify any ID against the live model list first — an invented one fails every run.'
        required: false
        default: ''

concurrency:
  group: tuesday-iteration
  cancel-in-progress: false

permissions:
  contents: write             # script commits and pushes back to main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci, not npm install: rules.md requires pinned dependencies, and the
      # lockfile is committed. npm install is free to drift it.
      - run: npm ci --no-fund

      # rules.md: "no known CVEs at deploy time". Previously disabled outright
      # with --no-audit, which made that line decorative.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      # The gate on the gate. If the validator's own tests do not pass, the
      # validator is not trustworthy and nothing should ship.
      - name: Test
        run: npm test

      - name: Run Tuesday job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          DRY_RUN: ${{ inputs.dry_run }}
          MODEL: ${{ inputs.model || 'claude-opus-5' }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL || 'claude-haiku-4-5-20251001' }}
          # Marketing
          MARKETING_ENABLED: ${{ secrets.MARKETING_ENABLED || 'true' }}
          MARKETING_AUTOPOST_BLUESKY: ${{ secrets.MARKETING_AUTOPOST_BLUESKY || 'false' }}
          MARKETING_AUTOPOST_MASTODON: ${{ secrets.MARKETING_AUTOPOST_MASTODON || 'false' }}
          MARKETING_AUTOPOST_X: ${{ secrets.MARKETING_AUTOPOST_X || 'false' }}
          MARKETING_AUTOPOST_NEWSLETTER: ${{ secrets.MARKETING_AUTOPOST_NEWSLETTER || 'false' }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: npx tsx scripts/tuesday.ts

      # A generation that fails after the model call is a week's work thrown away
      # with the runner. Keep it so the run can be replayed or salvaged by hand.
      - name: Preserve generator output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generator-output-${{ github.run_id }}
          path: |
            dry-run-output.json
            site/
          retention-days: 30
          if-no-files-found: ignore
