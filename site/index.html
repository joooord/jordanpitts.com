<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jordan Pitts</title>
  <meta name="description" content="Jordan Pitts — jordanpitts.com" />
  <meta name="theme-color" content="#0b140d" />
  <link rel="canonical" href="https://jordanpitts.com/" />

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph / Facebook / LinkedIn / iMessage -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jordan Pitts" />
  <meta property="og:title" content="Jordan Pitts" />
  <meta property="og:description" content="jordanpitts.com" />
  <meta property="og:url" content="https://jordanpitts.com/" />
  <meta property="og:image" content="https://jordanpitts.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Jordan Pitts" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jordan Pitts" />
  <meta name="twitter:description" content="jordanpitts.com" />
  <meta name="twitter:image" content="https://jordanpitts.com/og-image.jpg" />

  <link rel="preload" as="image" href="/poster.jpg" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #0b140d;
      overflow: hidden;
    }
    #bg, #poster {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* fills the screen on mobile incl. browser chrome */
      object-fit: cover;
      object-position: center;
    }
    /* poster sits under the video so there is never a black flash on load */
    #poster { z-index: 0; }
    #bg {
      z-index: 1;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #bg.ready { opacity: 1; }
    /* soft cinematic vignette; lets the button read against bright water */
    #shade {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%),
        linear-gradient(to top, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0) 22%);
    }
    /* ---- Liquid-glass iridescent email button ---- */
    #email {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: calc(26px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      /* one clean inset edge — a single solid glass pane, no 3d bevel */
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.55);
      transition: transform 0.22s cubic-bezier(.2,.8,.2,1),
                  border-color 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      isolation: isolate;
    }
    /* iridescent rotating sheen on the rim — river light: jade, lime, cream, a thread of gold */
    #email::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      padding: 1.5px;
      background: conic-gradient(from 210deg,
        #a7f3d0, #bef264, #fef3c7, #f5f5f4,
        #6ee7b7, #fbbf24, #a7f3d0);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: 0.42;
      animation: spin 9s linear infinite;
      pointer-events: none;
    }
    /* single clean sheen — a soft light sweep, not a beveled highlight */
    #email::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(150deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.14) 26%,
        rgba(255,255,255,0) 52%);
      pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #email:hover {
      transform: translateX(-50%) translateY(-2px) scale(1.06);
      border-color: rgba(255, 255, 255, 0.3);
    }
    #email:active {
      transform: translateX(-50%) translateY(0) scale(0.96);
    }
    #email:focus-visible {
      outline: 2px solid rgba(255,255,255,0.85);
      outline-offset: 3px;
    }
    #email svg {
      position: relative;
      z-index: 1;
      width: 19px;
      height: 19px;
      filter: drop-shadow(0 0.5px 1px rgba(0, 0, 0, 0.22));
    }
    @media (prefers-reduced-motion: reduce) {
      #email::before { animation: none; }
      #bg { display: none; }
    }
  </style>
</head>
<body>
  <img id="poster" src="/poster.jpg" alt="" aria-hidden="true" decoding="async" fetchpriority="high" />

  <video id="bg" autoplay loop muted playsinline preload="auto" disablepictureinpicture poster="/poster.jpg" aria-hidden="true">
    <source src="/river.mp4" type="video/mp4" />
  </video>

  <div id="shade"></div>

  <a id="email" href="mailto:jordan@jordanpitts.com" aria-label="Email Jordan">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" stroke="currentColor" stroke-width="2"/>
      <path d="M3 6l9 6.5L21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <script>
    // Make sure the video keeps playing even if a browser pauses it,
    // and only reveal it once frames are actually flowing (no black flash).
    var v = document.getElementById('bg');
    function play() {
      var p = v.play();
      if (p && p.catch) { p.catch(function () {}); }
    }
    function reveal() { v.classList.add('ready'); }
    v.addEventListener('playing', reveal, { once: true });
    v.addEventListener('loadeddata', function () { if (v.readyState >= 2 && !v.paused) reveal(); }, { once: true });
    play();
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) play();
    });
    document.addEventListener('touchstart', play, { once: true });
    document.addEventListener('click', play, { once: true });
  </script>
</body>
</html>
